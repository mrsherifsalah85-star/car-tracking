<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>صفحة الراكب - تتبع الباص</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 12px; }
  .container { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.25rem; text-align: center; margin-bottom: 4px; color: #38bdf8; }
  .subtitle { text-align: center; font-size: .78rem; color: #94a3b8; margin-bottom: 12px; }
  .card { background: #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  label { display: block; font-size: .82rem; margin-bottom: 6px; color: #cbd5e1; }
  input, select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155;
          background: #0f172a; color: #e2e8f0; font-size: 1rem; }
  .btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 1rem;
         font-weight: bold; cursor: pointer; margin-top: 10px; background: #0284c7; color: #fff; }
  #map { height: 45vh; min-height: 280px; border-radius: 12px; }
  .eta-card { position: relative; z-index: 1000; margin-top: -70px; margin-inline: 14px;
    background: rgba(15,23,42,.95); border: 1px solid #334155; border-radius: 14px;
    padding: 14px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .eta-grid { display: flex; justify-content: space-around; text-align: center; }
  .eta-item .val { font-size: 1.5rem; font-weight: bold; color: #4ade80; }
  .eta-item .lbl { font-size: .75rem; color: #94a3b8; margin-top: 2px; }
  .eta-updated { text-align: center; font-size: .7rem; color: #64748b; margin-top: 8px; }
  .legend { display: flex; justify-content: center; gap: 18px; margin-top: 10px; font-size: .75rem; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .lg-dot { width: 11px; height: 11px; border-radius: 50%; }
  .msg { color: #fbbf24; font-size: .85rem; margin-top: 10px; display: none; text-align: center; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
</style>
</head>
<body>
<div class="container">
  <h1>🧭 صفحة الراكب</h1>
  <p class="subtitle">تتبع الباص لحظيًا + تنبيه صوتي قبل الوصول</p>

  <div class="card">
    <label>🔑 كود السيارة:</label>
    <input type="text" id="vehicleId" value="car-001">
    <button class="btn" id="btnTrack" onclick="startWatching()">📡 ابدأ المتابعة</button>

    <label style="margin-top:12px">🔔 شغّل التنبيه الصوتي قبل وصول الباص بـ:</label>
    <select id="alertBefore">
      <option value="15" selected>15 دقيقة</option>
      <option value="10">10 دقائق</option>
      <option value="5">5 دقائق</option>
      <option value="3">3 دقائق</option>
      <option value="1">دقيقة واحدة</option>
      <option value="0">إيقاف التنبيه الصوتي</option>
    </select>
    <div class="msg" id="msgBox"></div>
  </div>

  <div id="map"></div>

  <div class="eta-card" id="etaCard">
    <div class="eta-grid">
      <div class="eta-item"><div class="val" id="etaKm">—</div><div class="lbl">المسافة (كم)</div></div>
      <div class="eta-item"><div class="val" id="etaMin">—</div><div class="lbl">الوقت المتوقع</div></div>
    </div>
    <div class="eta-updated" id="etaUpdated"></div>
  </div>

  <div class="legend">
    <span><span class="lg-dot" style="background:#ef4444"></span> الباص</span>
    <span><span class="lg-dot" style="background:#3b82f6"></span> أنت</span>
    <span><span class="lg-dot" style="background:#4ade80"></span> المسار</span>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyDn7mzRrWvCeEyCdq_O0p-Aq1aOGWsT8ok",
  authDomain: "car-tracking-5ef70.firebaseapp.com",
  projectId: "car-tracking-5ef70",
  storageBucket: "car-tracking-5ef70.appspot.com",
  messagingSenderId: "663036520242",
  appId: "1:663036520242:web:d6bbf3bce8519b8871d92b"
});
const db = firebase.firestore();
const OSRM_URL = 'https://router.project-osrm.org/route/v1/driving/';

let map, carMarker, meMarker, routeLine;
let myPos = null, carPos = null;
let lastRouteTime = 0, lastCarLoc = null;
let unsub = null, myWatchId = null;
let audioCtx = null, alerted = false, alarmInterval = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playAlarm() {
  ensureAudio();
  if (alarmInterval) return;
  showStopSoundButton();
  alarmInterval = setInterval(() => {
    const beep = (freq, dur, delay) => setTimeout(() => {
      if (!alarmInterval) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(1, audioCtx.currentTime);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }, delay * 1000);
    beep(1200, 0.2, 0); beep(800, 0.2, 0.25); beep(1200, 0.2, 0.5); beep(800, 0.2, 0.75);
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100]);
  }, 1000);
}

function stopAlarm() {
  if (alarmInterval) { clearInterval(alarmInterval); alarmInterval = null; }
  const b = document.getElementById('btnStopSound');
  if (b) b.style.display = 'none';
}

function showStopSoundButton() {
  let b = document.getElementById('btnStopSound');
  if (!b) {
    b = document.createElement('button');
    b.id = 'btnStopSound';
    b.className = 'btn';
    b.style.cssText = 'background:#ef4444;color:#fff;font-size:1.1rem;padding:15px;animation:pulse 1s infinite;';
    b.textContent = '🔕 إيقاف صوت التنبيه';
    b.onclick = stopAlarm;
    document.querySelector('.card').appendChild(b);
  } else { b.style.display = 'block'; }
}

const carIcon = L.divIcon({ className:'', html:'<div style="font-size:30px">🚌</div>', iconSize:[34,34], iconAnchor:[17,17] });
const meIcon  = L.divIcon({ className:'', html:'<div style="font-size:22px">📍</div>', iconSize:[24,24], iconAnchor:[12,12] });

function showMsg(t) {
  const b = document.getElementById('msgBox');
  b.textContent = t; b.style.display = 'block';
  setTimeout(() => b.style.display = 'none', 6000);
}

function initMap() {
  map = L.map('map').setView([30.0444, 31.2357], 13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(map);
}

function startWatching() {
  const vehicleId = document.getElementById('vehicleId').value.trim();
  if (!vehicleId) { showMsg('اكتب كود السيارة'); return; }
  if (!map) initMap();
  ensureAudio();

  const btn = document.getElementById('btnTrack');
  btn.disabled = true;
  btn.textContent = '⏳ جارِ الاتصال...';

  if (navigator.geolocation) {
    myWatchId = navigator.geolocation.watchPosition(
      (pos) => {
        myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        if (!meMarker) {
          meMarker = L.marker([myPos.lat, myPos.lng], { icon: meIcon }).addTo(map).bindPopup('📍 أنت هنا');
        } else { meMarker.setLatLng([myPos.lat, myPos.lng]); }
        tryRoute();
      },
      () => showMsg('مش قادر أحدد موقعك. هتشوف الباص بس من غير الوقت المتوقع.'),
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
    );
  }

  if (unsub) unsub();
  unsub = db.collection('tracking').doc(vehicleId).onSnapshot((doc) => {
    const d = doc.exists ? doc.data() : null;
    const ok = d && d.active === true && typeof d.lat === 'number' && typeof d.lng === 'number' && !(d.lat === 0 && d.lng === 0);
    if (!ok) {
      btn.textContent = '⏳ في انتظار الباص';
      showMsg('الباص مش شغال حاليًا. هيظهر أول ما السائق يبدأ الرحلة.');
      return;
    }
    carPos = { lat: d.lat, lng: d.lng };
    if (!carMarker) {
      carMarker = L.marker([carPos.lat, carPos.lng], { icon: carIcon }).addTo(map).bindPopup('🚌 الباص');
      map.setView([carPos.lat, carPos.lng], 15);
    } else { carMarker.setLatLng([carPos.lat, carPos.lng]); }
    btn.textContent = '✅ متصل — المتابعة شغالة';
    tryRoute();
  }, () => showMsg('خطأ في الاتصال'));
}

async function tryRoute() {
  if (!myPos || !carPos) return;
  const now = Date.now();
  if (lastCarLoc && lastRouteTime) {
    const moved = map.distance(L.latLng(lastCarLoc.lat, lastCarLoc.lng), L.latLng(carPos.lat, carPos.lng));
    if (moved < 30 && now - lastRouteTime < 15000) return;
  }
  lastRouteTime = now;
  lastCarLoc = { ...carPos };

  try {
    const res = await fetch(`${OSRM_URL}${carPos.lng},${carPos.lat};${myPos.lng},${myPos.lat}?overview=full&geometries=geojson`);
    const json = await res.json();
    if (json.code !== 'Ok' || !json.routes.length) { showMsg('تعذر حساب المسار'); return; }
    const route = json.routes[0];

    if (routeLine) map.removeLayer(routeLine);
    routeLine = L.geoJSON(route.geometry, { style: { color: '#4ade80', weight: 5, opacity: .85 } }).addTo(map);

    document.getElementById('etaCard').style.display = 'block';
    document.getElementById('etaKm').textContent = (route.distance / 1000).toFixed(1);
    const mins = Math.round(route.duration / 60);
    document.getElementById('etaMin').textContent = mins >= 60 ? `${Math.floor(mins/60)} س ${mins%60} د` : `${mins} دقيقة`;
    document.getElementById('etaUpdated').textContent = '🕐 آخر تحديث: ' + new Date().toLocaleTimeString('ar-EG');

    const alertMin = parseInt(document.getElementById('alertBefore').value);
    if (alertMin > 0 && mins <= alertMin && !alerted) { alerted = true; playAlarm(); }
    else if (mins > alertMin + 1) { alerted = false; stopAlarm(); }
  } catch (e) { showMsg('خطأ في الاتصال بخادم المسارات'); }
}
</script>
</body>
</html>
