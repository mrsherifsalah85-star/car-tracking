<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تتبع باص المدرسين</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;font-family:Tahoma,Arial,sans-serif}
  #map{height:100%;width:100%}
  #topbar{position:absolute;top:0;left:0;right:0;z-index:1000;
    background:#1a237e;color:#fff;padding:10px 14px;font-size:15px;
    box-shadow:0 2px 6px rgba(0,0,0,.3);display:flex;justify-content:space-between;align-items:center}
  #status{font-size:12px;color:#c5cae9}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:5px;vertical-align:middle}
  .red{background:#ff5252}.green{background:#69f0ae}
</style>
</head>
<body>
<div id="topbar">
  <div>🚌 تتبع باص المدرسين <span id="carName" style="color:#ffcc80"></span></div>
  <div id="status"><span class="dot red" id="dot"></span><span id="statusText">جارٍ الاتصال...</span></div>
</div>
<div id="map"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  // ⚠️ ضع بيانات مشروعك هنا من: Firebase Console → Project Settings → Your apps → CDN
  const firebaseConfig = {
    apiKey: "AIzaSyDn7mzRrWvCeEyCdq_O0p-Aq1aOGWsT8ok",
    authDomain: "car-tracking-5ef70.firebaseapp.com",
    projectId: "car-tracking-5ef70",
    storageBucket: "car-tracking-5ef70.appspot.com",
    messagingSenderId: "663036520242",
    appId: "1:663036520242:web:d6bbf3bce8519b8871d92b"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // رقم السيارة من الرابط (?car=car-001) — لو مش موجود نستخدم car-001
  const params = new URLSearchParams(location.search);
  const carId = params.get("car") || "car-001";
  document.getElementById("carName").textContent = "(" + carId + ")";

  // خريطة OpenStreetMap — تبدأ على مصر
  const map = L.map("map").setView([30.0444, 31.2357], 13);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "© OpenStreetMap"
  }).addTo(map);

  const busIcon = L.divIcon({
    className: "",
    html: '<div style="font-size:34px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))">🚌</div>',
    iconSize: [34, 34], iconAnchor: [17, 17]
  });
  let marker = null;

  // متابعة المستند في Firestore لحظة بلحظة
  db.collection("tracking").doc(carId).onSnapshot((doc) => {
    const dot = document.getElementById("dot");
    const txt = document.getElementById("statusText");
    if (doc.exists) {
      const d = doc.data();
      if (d.active === true && typeof d.lat === "number" && typeof d.lng === "number") {
        const pos = [d.lat, d.lng];
        if (!marker) {
          marker = L.marker(pos, { icon: busIcon }).addTo(map);
          map.setView(pos, 16);
        } else {
          marker.setLatLng(pos);
        }
        dot.className = "dot green";
        txt.textContent = "متصل الآن";
      } else {
        dot.className = "dot red";
        txt.textContent = "الباص مش شغال حاليًا";
      }
    } else {
      dot.className = "dot red";
      txt.textContent = "مفيش بيانات لهذا الكود";
    }
  }, (err) => {
    document.getElementById("dot").className = "dot red";
    document.getElementById("statusText").textContent = "خطأ في الاتصال";
    console.error(err);
  });
</script>
</body>
</html>
