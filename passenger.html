<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>صفحة الراكب - تتبع السيارة</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 12px; }
  .container { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.25rem; text-align: center; margin-bottom: 4px; color: #38bdf8; }
  .subtitle { text-align: center; font-size: .78rem; color: #94a3b8; margin-bottom: 12px; }
  .card { background: #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  label { display: block; font-size: .82rem; margin-bottom: 6px; color: #cbd5e1; }
  input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155;
          background: #0f172a; color: #e2e8f0; font-size: 1rem; }
  input:focus { outline: none; border-color: #38bdf8; }
  .btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 1rem;
         font-weight: bold; cursor: pointer; margin-top: 10px; background: #0284c7; color: #fff; }
  .btn:hover { background: #0369a1; }
  #map { height: 45vh; min-height: 280px; border-radius: 12px; }
  .eta-card { position: relative; z-index: 1000; margin-top: -70px; margin-inline: 14px;
    background: rgba(15,23,42,.95); border: 1px solid #334155; border-radius: 14px;
    padding: 14px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .eta-grid { display: flex; justify-content: space-around; text-align: center; }
  .eta-item .val { font-size: 1.5rem; font-weight: bold; color: #4ade80; }
  .eta-item .lbl { font-size: .75rem; color: #94a3b8; margin-top: 2px; }
  .eta-updated { text-align: center; font-size: .7rem; color: #64748b; margin-top: 8px; }
  .legend { display: flex; justify-content: center; gap: 18px; margin-top: 10px; font-size: .75rem; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .lg-dot { width: 11px; height: 11px; border-radius: 50%; }
  .error { color: #f87171; font-size: .85rem; margin-top: 10px; display: none; text-align:center; }
</style>
</head>
<body>
<div class="container">
  <h1>🧭 صفحة الراكب</h1>
  <p class="subtitle">تتبع السيارة لحظياً + المسافة والوقت المتوقع</p>

  <div class="card">
    <label>🔑 كود السيارة التي تريد تتبعها:</label>
    <input type="text" id="vehicleId" value="car-001" placeholder="نفس كود السائق">
    <button class="btn" id="btnTrack" onclick="startWatching()">📡 ابدأ المتابعة</button>
    <div class="error" id="errorBox"></div>
  </div>

  <div id="map"></div>

  <div class="eta-card" id="etaCard">
    <div class="eta-grid">
      <div class="eta-item"><div class="val" id="etaKm">—</div><div class="lbl">المسافة (كم)</div></div>
      <div class="eta-item"><div class="val" id="etaMin">—</div><div class="lbl">الوقت المتوقع</div></div>
    </div>
    <div class="eta-updated" id="etaUpdated"></div>
  </div>

  <div class="legend">
    <span><span class="lg-dot" style="background:#ef4444"></span> السيارة</span>
    <span><span class="lg-dot" style="background:#3b82f6"></span> أنت</span>
    <span><span class="lg-dot" style="background:#4ade80"></span> المسار</span>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============================================================
   ① ضع إعدادات مشروع Firebase هنا (نفس إعدادات السائق)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDn7mzRrWvCeEyCdq_D0p-Aq1sOGWsT8ok",
  authDomain: "car-tracking-5ef70.firebaseapp.com",
  databaseURL: "https://car-tracking-5ef70-default-rtdb.firebaseio.com",
  projectId: "car-tracking-5ef70",
  storageBucket: "car-tracking-5ef70.firebasestorage.app",
  messagingSenderId: "663036520242",
  appId: "1:663036520242:web:d6bbf3bce8519b8871d92b",
  measurementId: "G-279KCRRWCO"
};


firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const OSRM_URL = 'https://router.project-osrm.org/route/v1/driving/';

let map, carMarker, meMarker, routeLine;
let myPos = null, carPos = null;
let lastRouteTime = 0, lastCarLoc = null;
let fbListener = null, myWatchId = null;

const carIcon = L.divIcon({ className:'', html:'<div style="font-size:26px">🚗</div>',
  iconSize:[30,30], iconAnchor:[15,15] });
const meIcon  = L.divIcon({ className:'', html:'<div style="font-size:22px">📍</div>',
  iconSize:[24,24], iconAnchor:[12,12] });

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = msg; box.style.display = 'block';
  setTimeout(() => box.style.display = 'none', 6000);
}

function initMap() {
  map = L.map('map').setView([30.0444, 31.2357], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 19
  }).addTo(map);
}

function startWatching() {
  const vehicleId = document.getElementById('vehicleId').value.trim();
  if (!vehicleId) { showError('اكتب كود السيارة'); return; }
  if (!navigator.geolocation) { showError('المتصفح لا يدعم GPS'); return; }
  if (!map) initMap();

  document.getElementById('btnTrack').disabled = true;
  document.getElementById('btnTrack').textContent = '⏳ جارِ الاتصال...';

  myWatchId = navigator.geolocation.watchPosition(
    (pos) => {
      myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (!meMarker) {
        meMarker = L.marker([myPos.lat, myPos.lng], { icon: meIcon }).addTo(map)
          .bindPopup('📍 أنت هنا');
        map.setView([myPos.lat, myPos.lng], 15);
      } else {
        meMarker.setLatLng([myPos.lat, myPos.lng]);
      }
      tryRoute();
    },
    (err) => showError('خطأ GPS: ' + err.message + ' — فعّل الموقع'),
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
  );

  if (fbListener) db.ref('tracking/' + vehicleId).off('value', fbListener);
  fbListener = db.ref('tracking/' + vehicleId).on('value', (snap) => {
    const d = snap.val();
    if (!d || d.active === false) {
      showError('السيارة غير متصلة حالياً — انتظر بدء السائق للتتبع');
      return;
    }
    carPos = { lat: d.lat, lng: d.lng };
    if (!carMarker) {
      carMarker = L.marker([carPos.lat, carPos.lng], { icon: carIcon }).addTo(map)
        .bindPopup('🚗 السيارة');
    } else {
      carMarker.setLatLng([carPos.lat, carPos.lng]);
    }
    document.getElementById('btnTrack').textContent = '✅ متصل — تتبع نشط';
    tryRoute();
  });
}

async function tryRoute() {
  if (!myPos || !carPos) return;
  const now = Date.now();

  if (lastCarLoc && lastRouteTime) {
    const moved = map.distance(
      L.latLng(lastCarLoc.lat, lastCarLoc.lng),
      L.latLng(carPos.lat, carPos.lng)
    );
    if (moved < 40 && now - lastRouteTime < 20000) return;
  }
  lastRouteTime = now;
  lastCarLoc = { ...carPos };

  try {
    const url = `${OSRM_URL}${carPos.lng},${carPos.lat};${myPos.lng},${myPos.lat}` +
                `?overview=full&geometries=geojson`;
    const res = await fetch(url);
    const json = await res.json();

    if (json.code !== 'Ok' || !json.routes.length) {
      showError('تعذر حساب المسار — حاول لاحقاً');
      return;
    }
    const route = json.routes[0];

    if (routeLine) map.removeLayer(routeLine);
    routeLine = L.geoJSON(route.geometry, {
      style: { color: '#4ade80', weight: 5, opacity: .85 }
    }).addTo(map);

    document.getElementById('etaCard').style.display = 'block';
    document.getElementById('etaKm').textContent  = (route.distance / 1000).toFixed(1);
    const mins = Math.round(route.duration / 60);
    document.getElementById('etaMin').textContent = mins >= 60
      ? `${Math.floor(mins/60)} س ${mins%60} د` : `${mins} دقيقة`;
    document.getElementById('etaUpdated').textContent =
      '🕐 آخر تحديث: ' + new Date().toLocaleTimeString('ar-EG');
  } catch (e) {
    showError('خطأ في الاتصال بخادم المسارات');
  }
}
</script>
</body>
</html>
